spring:
  application:
    name: service

  datasource:
    url: jdbc:postgresql://localhost:5433/taxpayer_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:/liquibase/changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    root: INFO